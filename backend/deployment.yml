apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: assessment

spec:
  replicas: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend
      
    spec:
      containers:
        - name: backend

          image: krradhey/three-tier-backend:v1
          imagePullPolicy: Always

          ports:
            - containerPort: 3000

          env:
            - name: PORT
              value: "3000"

            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: MONGO_URI

            - name: MONGO_DB
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: MONGO_DB    

          #    - name: MONGO_USER
          #     valueFrom:
          #      secretKeyRef:
          #        name: app-secret
          #        key: MONGO_USER

           # - name: MONGO_PASSWORD
            #  valueFrom:
            #    secretKeyRef:
            #      name: app-secret
            #      key: MONGO_PASSWORD

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "250m"
              memory: "256Mi"

          startupProbe:
            httpGet:
              path: /health
              port: 3000
            failureThreshold: 30
            periodSeconds: 5

          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20

            





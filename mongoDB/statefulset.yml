apiVersion: apps/v1
kind: StatefulSet

metadata:
  namespace: assessment
  name: mongodb

spec:
  serviceName: mongodb
  replicas: 1

  selector:
    matchLabels:
      app: mongodb
    
  template:
    metadata:
      labels:
        app: mongodb
    
    spec:
      containers:
        - name: mongodb
          image: mongo:8.0

          volumeMounts:
            - name: mongodb-storage        # must be same as Volume name defined below
              mountPath: /data/db          # mongodb stores data at /data/db

          ports:
            - containerPort: 27017

          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: MONGO_USERNAME

            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: MONGO_PASSWORD

      volumes:
        - name: mongodb-storage
          persistentVolumeClaim:
            claimName: mongodb-pvc

